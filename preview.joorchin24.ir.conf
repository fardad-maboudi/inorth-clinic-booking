# Preview subdomain configuration for preview.joorchin.site
server {
    listen 80;
    server_name preview.joorchin.site;

    # Defer Docker DNS for dynamically included preview upstreams.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;


    # Root location - optional landing page or status
    location = / {
        return 200 'JoorChin24 Preview Server';
        add_header Content-Type text/plain;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Generated apps call /api/v1/... on this origin (same as local nginx-proxy).
    # Without this, runtime telemetry and entity API requests 404 on the preview
    # host and the admin Runtime tab stays empty.
    location /api/ {
        proxy_pass http://be-core:15000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Live notifications (and the realtime plugin): native WebSocket upgrade to
    # be-core's /ws-user-apps hub. Without Upgrade/Connection headers the
    # handshake fails and generated sites fall back to polling only.
    location /ws-user-apps {
        proxy_pass http://be-core:15000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Include all dynamically generated preview configurations
    include /etc/nginx/previews/*.conf;

    # Fallback for stopped/reaped previews. The idle reaper stops inactive
    # preview containers and removes their per-app '/app/<id>/' block. A live
    # preview's longer prefix wins longest-prefix-match so this is never hit
    # while up; once reaped, only this shorter '/app/' prefix matches. Forward
    # to be-core which (re)starts the container and returns a self-refreshing
    # "coming up" page, so any hit on a sleeping preview wakes it.
    location /app/ {
        proxy_set_header X-Original-Uri $request_uri;
        # Shared secret for be-core's wake endpoint, which FAILS CLOSED without
        # it. Written by be/vps on every nginx sync from PREVIEW_WAKE_SECRET —
        # never commit it here. The wildcard makes a host without the secret
        # start normally (an exact include of a missing file is a fatal error)
        # rather than trading a dead wake path for a dead nginx.
        include /etc/nginx/previews/wake-secret.include*;
        rewrite ^ /api/v1/internal/preview-wake break;
        proxy_pass http://be-core:15000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # General error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
        return 404 "Resource not found";
        add_header Content-Type text/plain;
    }

    location = /50x.html {
        internal;
        return 500 "Internal server error";
        add_header Content-Type text/plain;
    }
}
